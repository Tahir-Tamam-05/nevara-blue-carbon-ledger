version: '3.8'

services:
  # Main Node.js Application
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://user:pass@db:5432/nevara
      - MRV_SERVICE_URL=http://mrv-api:8001
      - MRV_API_KEY=${MRV_API_KEY:-dev-secret-key}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # MRV API Service (Python)
  mrv-api:
    build: ./mrv-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgres://user:pass@db:5432/nevara
      - REDIS_URL=redis://redis:6379/0
      - MRV_API_KEY=${MRV_API_KEY:-dev-secret-key}
      - GEE_SERVICE_ACCOUNT=${GEE_SERVICE_ACCOUNT}
      - GEE_PRIVATE_KEY_JSON=${GEE_PRIVATE_KEY_JSON}
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MRV Worker Service (Python)
  mrv-worker:
    build: ./mrv-service
    command: python worker.py
    environment:
      - DATABASE_URL=postgres://user:pass@db:5432/nevara
      - REDIS_URL=redis://redis:6379/0
      - MRV_API_KEY=${MRV_API_KEY:-dev-secret-key}
      - GEE_SERVICE_ACCOUNT=${GEE_SERVICE_ACCOUNT}
      - GEE_PRIVATE_KEY_JSON=${GEE_PRIVATE_KEY_JSON}
    depends_on:
      - db
      - redis

  # Infrastructure
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=nevara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
